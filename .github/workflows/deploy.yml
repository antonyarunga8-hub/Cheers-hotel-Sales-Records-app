name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Enable web
        run: flutter config --enable-web

      - name: Create web project files
        run: |
          flutter create --platforms web . || true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (show errors only)
        run: dart analyze --no-fatal-warnings || true

      - name: Build web
        run: flutter build web --release --web-renderer html --base-href "/Cheers-hotel-Sales-Records-app/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
