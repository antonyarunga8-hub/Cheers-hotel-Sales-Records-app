<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cheers Hotel — Sales & Records POS App">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cheers Hotel POS">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>Cheers Hotel — Sales & Records</title>
  <style>
    body {
      margin: 0;
      background-color: #FBF8F8;
      font-family: sans-serif;
    }
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #8B1E2B;
    }
    .loading h2 { margin-bottom: 16px; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #f3e0e3;
      border-top: 4px solid #8B1E2B;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <h2>Cheers Hotel</h2>
    <div class="spinner"></div>
    <p style="margin-top: 16px; font-size: 14px; color: #666;">Loading POS system...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
